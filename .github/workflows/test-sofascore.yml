name: Test Sofascore Access (Playwright)

on:
  workflow_dispatch:

jobs:
  test-sofascore:
    name: Test Sofascore UCL 26/27 API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Sofascore UCL Test
        run: node scripts/test-sofascore-ci.mjs
